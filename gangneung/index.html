<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>강릉 여행 계획</title>
<meta name="theme-color" content="#F7F9FB" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#141C22" media="(prefers-color-scheme:dark)">
<script>
/* 테마를 CSS 적용 전에 먼저 지정해 깜빡임 방지 */
(function(){try{var t=localStorage.getItem("gangneung-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: 한 줄 헤더 + 장소 추가 바 + 일차별 세로 타임라인(넓은 화면에선 열로 나란히) */
/* ===== v3 · 버전1(흑백 수묵) 베이스 + 빨간 선 커서 · 민트는 배경 웨시로만 ===== */
:root{
  /* 라이트 — 흑백 수묵 */
  --bg:#F4F4F5; --surface:#FFFFFFEC; --ink:#0B0B0C; --muted:#5E6064; --line:#D8D8DB;
  --sea:#0B0B0C; --sea-soft:#E7E7E9; --pine:#2A2B2E; --pine-soft:#E7E7E9; --sun:#4A4C50; --sun-soft:#ECECEE;
  --danger:#E23B2E;
  --land:#ECECEE; --sea-fill:#DEDEE1; --road:#E8E8EA; --on-dot:#FFFFFF;
  /* 인터랙션 = 먹색(흑백). 선/테두리/뱃지에 민트 금지 */
  --accent:#17181A; --accent-weak:#E6E6E8;
  --red:#E23B2E;
  /* 민트는 오직 배경 웨시용 (blot1). 전경 색으로는 안 씀 */
  --mint-bg:38,166,154;
  /* 동선(일차) — 농담만 다른 먹 톤 */
  --d0:#B6B7BA; --d1:#1C1D20; --d2:#6F7175;
  --grad:linear-gradient(170deg,#FBFBFC 0%,#EFEFF1 48%,#E3E3E6 100%);
  --ink-rgb:20,21,23;
  --blot1:38,166,154;   /* 배경 민트 웨시 (아주 옅게) */
  --blot2:226,59,46;    /* 빨강 (클릭 포인트) */
  --map-bg:#EAF6F3; --map-land:#EAF6F3; --map-sea:#D6EFEA; --map-ink:#2A3B38; --map-line:#CDE7E1;
  --paper:#F4F4F5;
  --display:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --body:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif;
  --shadow-sm:0 2px 10px rgba(20,21,23,.06);
  --shadow-md:0 8px 26px rgba(20,21,23,.12);
}
/* 다크 — 먹빛 밤 */
:root[data-theme="dark"]{
  --bg:#0E0F11; --surface:#1A1B1EEC; --ink:#ECECEE; --muted:#9A9CA1; --line:#2A2B2E;
  --sea:#ECECEE; --sea-soft:#242528; --pine:#C4C6CA; --pine-soft:#242528; --sun:#9A9CA1; --sun-soft:#202123;
  --danger:#FF5648;
  --land:#17181A; --sea-fill:#232427; --road:#1D1E20; --on-dot:#0E0F11;
  --accent:#ECECEE; --accent-weak:#26272A;
  --red:#FF5648;
  --mint-bg:45,212,191;
  --d0:#55575C; --d1:#ECECEE; --d2:#9A9CA1;
  --grad:linear-gradient(170deg,#17181B 0%,#101113 50%,#0A0B0C 100%);
  --ink-rgb:236,236,238;
  --blot1:45,212,191;
  --blot2:255,86,72;
  --map-bg:#15302C; --map-land:#15302C; --map-sea:#0F2420; --map-ink:#CFEAE3; --map-line:#234B44;
  --paper:#0E0F11;
  --shadow-sm:0 2px 12px rgba(0,0,0,.4);
  --shadow-md:0 10px 30px rgba(0,0,0,.55);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0F11; --surface:#1A1B1EEC; --ink:#ECECEE; --muted:#9A9CA1; --line:#2A2B2E;
  --sea:#ECECEE; --sea-soft:#242528; --pine:#C4C6CA; --pine-soft:#242528; --sun:#9A9CA1; --sun-soft:#202123;
  --danger:#FF5648;
  --land:#17181A; --sea-fill:#232427; --road:#1D1E20; --on-dot:#0E0F11;
  --accent:#ECECEE; --accent-weak:#26272A;
  --red:#FF5648;
  --mint-bg:45,212,191;
  --d0:#55575C; --d1:#ECECEE; --d2:#9A9CA1;
  --grad:linear-gradient(170deg,#17181B 0%,#101113 50%,#0A0B0C 100%);
  --ink-rgb:236,236,238;
  --blot1:45,212,191;
  --blot2:255,86,72;
  --map-bg:#15302C; --map-land:#15302C; --map-sea:#0F2420; --map-ink:#CFEAE3; --map-line:#234B44;
  --paper:#0E0F11;
  --shadow-sm:0 2px 12px rgba(0,0,0,.4);
  --shadow-md:0 10px 30px rgba(0,0,0,.55);
  color-scheme:dark;
}}
*{box-sizing:border-box}
body{background:var(--paper);background-image:var(--grad);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.62;-webkit-font-smoothing:antialiased;letter-spacing:0;position:relative;min-height:100vh;transition:background-color .4s ease,color .4s ease}
/* 먹 번짐 캔버스: 가운데에서 계속 번지고, 마우스/터치에 반응 */
#ink{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none;opacity:.9}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 60px;display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== 가운데 정렬 마스트헤드 + 키로 마스코트 ===== */
.masthead{position:relative;padding:18px 0 24px;margin-bottom:6px;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:9px;margin:0 0 6px;justify-content:center;flex-wrap:wrap}
.eyebrow .geo{font-family:var(--display);font-weight:800;font-size:15px;line-height:1;color:var(--red);letter-spacing:.14em}
.eyebrow .geo-full{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
/* 키로 얼굴 — 둥근 사각형 + 점 두 눈 (심플/둥글둥글) */
.kiro{width:clamp(130px,22vw,200px);margin:6px auto 2px;cursor:pointer}
.kiro svg{display:block;width:100%;height:auto;overflow:visible}
.k-face{fill:var(--surface);stroke:var(--ink);stroke-width:5}
.k-eye{fill:var(--ink)}
@media (prefers-reduced-motion:no-preference){
  .kiro svg{animation:kfloat 5s ease-in-out infinite}
}
@keyframes kfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.dateline{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:9px 16px;margin-top:16px;font-size:12px;color:var(--muted)}
.dateline .dl-no{font-family:var(--display);font-weight:700;letter-spacing:.1em;color:var(--ink)}
.dateline label{display:inline-flex;align-items:center;gap:7px;letter-spacing:.08em}
.dateline input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.status{font-size:12px;color:var(--muted)}
/* 메타: 오른쪽 상단 */
.meta{position:absolute;top:14px;right:0;display:flex;align-items:center;gap:8px;z-index:5}
.weather{display:inline-flex;align-items:center;gap:10px;background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink);box-shadow:var(--shadow-sm);white-space:nowrap}
.weather .wx-now,.weather .wx-tmr{display:inline-flex;align-items:center;gap:6px}
.weather .wx-tmr{padding-left:10px;border-left:1px solid var(--line);color:var(--muted)}
.weather .wx-tl{font-size:11px;opacity:.85}
.weather .wx-emo{font-size:16px;line-height:1}
.weather .wx-temp{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.weather .wx-tt{font-variant-numeric:tabular-nums}
.weather .wx-desc{color:var(--muted)}
.weather.loading .wx-tmr{display:none}
.weather.loading{color:var(--muted)}

/* 옷차림 말풍선 — 날씨 칩 바로 밑(상단 우측)에서 자동으로 톡 */
.wx-pop{position:fixed;top:calc(54px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px));z-index:120;
  width:max-content;max-width:min(86vw,330px);display:flex;flex-direction:column;gap:10px;text-align:left;
  background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:16px;padding:14px 15px 11px;box-shadow:var(--shadow-md);
  animation:wxpop .4s cubic-bezier(.22,1,.36,1)}
.wx-pop[hidden]{display:none}
/* 말풍선 꼬리 — 위(날씨 칩)를 가리킴 */
.wx-pop::before{content:"";position:absolute;top:-8px;right:30px;width:15px;height:15px;background:var(--surface);
  border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.wx-pop-row{display:flex;gap:11px;align-items:flex-start}
.wx-pop-tmr{padding-top:9px;border-top:1px dashed var(--line)}
.wx-pop-emo{font-size:28px;line-height:1.05;flex:none}
.wx-pop-body strong{display:block;font-size:13px;color:var(--ink);margin-bottom:3px}
.wx-pop-body p{margin:0;font-size:12.5px;line-height:1.55;color:var(--muted);white-space:normal}
.wx-pop-src{font-size:10.5px;color:var(--muted);text-decoration:none;letter-spacing:.01em;opacity:.85}
.wx-pop-src:hover{color:var(--accent);text-decoration:underline}
.wx-pop-x{position:absolute;top:8px;right:10px;background:none;border:0;font-size:18px;line-height:1;color:var(--muted);padding:2px;z-index:1}
.wx-pop-x:hover{color:var(--ink)}
@keyframes wxpop{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}
@media (max-width:600px){.wx-pop{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:14px;right:14px;max-width:none}
  .wx-pop::before{display:none}}
.themebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);box-shadow:var(--shadow-sm);transition:border-color .2s,transform .2s;flex:none}
.themebtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.themebtn svg{width:18px;height:18px}
.themebtn .ic-sun{display:none}
.themebtn .ic-moon{display:block}
:root[data-theme="dark"] .themebtn .ic-sun{display:block}
:root[data-theme="dark"] .themebtn .ic-moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .themebtn .ic-sun{display:block}:root:not([data-theme="light"]) .themebtn .ic-moon{display:none}}

.add{background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm)}
.add form{display:grid;grid-template-columns:2fr 1fr 1fr 90px 2fr auto auto;gap:8px}
.fcand{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;border:1px solid var(--line);border-radius:8px;padding:0 10px;cursor:pointer;transition:border-color .15s,color .15s}
.fcand:has(input:checked){border-color:var(--accent);color:var(--accent)}
.add input,.add select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;transition:border-color .15s}
.add input:focus,.add select:focus{border-color:var(--accent);outline:none}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-weight:600;white-space:nowrap;transition:filter .2s,box-shadow .2s;box-shadow:var(--shadow-sm)}
.btn:hover:not(:disabled){filter:brightness(1.06);box-shadow:var(--shadow-md)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-size:13px;color:var(--ink);transition:border-color .2s,color .2s,background .2s}
.ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.ideas{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.ideas span.lbl{color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 12px;font-size:13px;color:var(--ink);transition:border-color .15s,color .15s,background .15s}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-weak);transform:translateY(-1px)}
@media (max-width:820px){.add form{grid-template-columns:1fr 1fr}.add form .name,.add form .memo{grid-column:1/-1}.add form .btn{grid-column:1/-1}.fcand{padding-block:8px}}

/* 에디토리얼 섹션 라벨 */
.board-label{display:flex;align-items:baseline;gap:14px;margin:10px 0 0;color:var(--muted)}
.board-label span{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.28em;color:var(--ink);text-transform:uppercase}
.board-label::after{content:"";height:1px;background:var(--line);flex:1;align-self:center}
.board-label em{font-style:normal;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--muted)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.day{display:flex;flex-direction:column;gap:8px;min-width:0}
.day h2{font-family:var(--display);font-weight:800;font-size:15px;margin:0;display:flex;align-items:baseline;gap:8px;letter-spacing:.01em}
.day h2 .date{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.day h2 .n{margin-left:auto;font-family:var(--body);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.day.undecided h2{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--line);padding-left:12px;min-height:44px}
.empty{font-size:13px;color:var(--muted);padding:10px 0}

.card{background:var(--surface);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;min-width:0;transition:border-color .2s,box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:color-mix(in srgb,var(--ink) 28%,var(--line))}
.card.open{border-color:var(--ink);box-shadow:var(--shadow-md)}
/* 1일차·2일차 타임라인 — 먹 농담만 다르게 */
.day[data-day="1"] .list{border-left-color:color-mix(in srgb,var(--ink) 38%,var(--line))}
.day[data-day="2"] .list{border-left-color:var(--line)}
.day[data-day="1"] h2 .n,.day[data-day="2"] h2 .n{color:var(--muted)}
.row{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;width:100%;background:none;border:0;text-align:left}
.time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);width:38px;flex:none;padding-top:2px}
.main{flex:1;min-width:0}
.pname{font-weight:600;overflow-wrap:anywhere}
.pmemo{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.card.open .pmemo{white-space:normal;overflow-wrap:anywhere}
.cat{flex:none;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;margin-top:2px}
.c-관광{background:var(--sea-soft);color:var(--sea)}
.c-맛집{background:var(--sun-soft);color:var(--sun)}
.c-카페{background:var(--sun-soft);color:var(--sun)}
.c-숙소{background:var(--land);color:var(--ink)}
.c-기타{background:var(--land);color:var(--muted)}
.cand-b{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.card.cand .pname{color:var(--muted)}
.candrow{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.approx{font-size:12px;color:var(--ink);background:var(--accent-weak);border-radius:8px;padding:6px 8px}
.locbtns{display:inline-flex;align-items:center;gap:6px}
.linkish{background:none;border:0;padding:4px 2px;font-size:12px;color:var(--accent);text-decoration:underline}
.has-info{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:6px;vertical-align:middle}

.detail{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.fields{display:grid;grid-template-columns:1fr 100px;gap:8px}
.fields select,.fields input,.detail textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0;width:100%;transition:border-color .15s}
.fields select:focus,.fields input:focus,.detail textarea:focus{border-color:var(--accent);outline:none}
.detail textarea{resize:vertical;min-height:54px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px;transition:border-color .15s,background .15s}
.links a:hover{border-color:var(--accent);background:var(--accent-weak)}
.info{background:var(--land);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.info dt{color:var(--muted);font-size:12px;white-space:nowrap}
.info dd{margin:0;overflow-wrap:anywhere}
.info .sum{margin:0}
.info .note{font-size:11px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.danger{color:var(--danger);border-color:var(--line)}
.by{font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 4px 12px rgba(17,31,40,.16)}

.mapbox{background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
.maphead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.maphead h2{font-family:var(--display);font-weight:700;font-size:15px;margin:0 8px 0 0;letter-spacing:-0.01em}
/* 지도 접기/펴기 토글 */
.map-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--muted);transition:border-color .2s,color .2s}
.map-toggle:hover{border-color:var(--accent);color:var(--ink)}
.map-toggle .arr{display:inline-block;transition:transform .3s ease;font-size:14px;line-height:1}
.mapbox.compact .map-toggle .arr{transform:rotate(180deg)}
.mapbox.compact .map-toggle .lbl::after{content:"지도 펼치기"}
.mapbox:not(.compact) .map-toggle .lbl::after{content:"지도 접기"}
/* 접힌 상태: 지도+노트 숨기고 헤더만 */
.mapwrap,.mapnote{transition:max-height .4s ease,opacity .3s ease,padding .3s ease}
.mapbox.compact .mapwrap{max-height:0;opacity:0;overflow:hidden}
.mapbox.compact .mapnote{max-height:0;opacity:0;overflow:hidden;padding:0 12px}

<script src="config.js"></script>
<script>
/* ====== 먹 번짐 배경 캔버스 (계속 번지고, 마우스/터치에 반응) ====== */
const INK=(function(){
  const cv=document.getElementById("ink");if(!cv)return null;
  const ctx=cv.getContext("2d");
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  let W=0,H=0,dpr=1,blobs=[],t=0,raf=null;
  function cssVar(n,fb){return (getComputedStyle(document.documentElement).getPropertyValue(n).trim()||fb)}
  function blotColor(which,a){ // which: 0=민트,1=보라
    const v=which? cssVar("--blot2","124,92,252") : cssVar("--blot1","20,184,166");
    return `rgba(${v},${a})`;
  }
  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  // 하나의 색 번짐: 중심에서 퍼지며 옅어짐 (c=0 민트 / 1 빨강)
  function spawn(x,y,r,life,c){blobs.push({x,y,r0:r*0.2,r,age:0,life:life||1,c:c==null?0:c})}
  function splash(x,y,power,c){ // 클릭/터치 시 확 번짐
    const n=5+Math.floor(power*4);const col=c==null?0:c;
    for(let i=0;i<n;i++){const a=Math.random()*6.283,d=Math.random()*40*power;
      spawn(x+Math.cos(a)*d,y+Math.sin(a)*d,(24+Math.random()*54)*power,0.9+Math.random()*0.5,col)}
  }
  function frame(dt){
    t+=dt;
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation="source-over";
    // 배경: 민트가 넓고 느리게 은은히 피어오름 (배경 웨시로만)
    if(!reduce&&Math.random()<0.016){const cx=W/2+(Math.random()-0.5)*W*0.55,cy=H*0.5+(Math.random()-0.5)*H*0.55;spawn(cx,cy,110+Math.random()*140,2.2+Math.random(),0)}
    for(let i=blobs.length-1;i>=0;i--){
      const b=blobs[i];b.age+=dt/ (reduce?1600:3600) / b.life;
      if(b.age>=1){blobs.splice(i,1);continue}
      const e=b.age, r=b.r0+(b.r-b.r0)*(1-Math.pow(1-e,2));
      // 민트(c=0) 배경 웨시는 옅게, 빨강(c=1, 클릭)만 선명하게
      const alpha=(1-e)*(b.c? 0.16 : 0.11);
      const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,r);
      g.addColorStop(0,blotColor(b.c,alpha));
      g.addColorStop(0.55,blotColor(b.c,alpha*0.45));
      g.addColorStop(1,blotColor(b.c,0));
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,r,0,6.283);ctx.fill();
    }
    if(blobs.length>150)blobs.splice(0,blobs.length-150);
  }
  let last=performance.now();
  function loop(now){const dt=Math.min(now-last,60);last=now;frame(dt);raf=requestAnimationFrame(loop)}
  addEventListener("resize",resize,{passive:true});
  resize();
  // 처음에 가운데 큰 민트 웨시
  spawn(W/2,H*0.42,220,3,0);spawn(W*0.3,H*0.6,180,3,0);
  raf=requestAnimationFrame(loop);
  return {spawn,splash,toLocal:(x,y)=>{const r=cv.getBoundingClientRect();return [x-r.left,y-r.top]}};
})();

/* ---- 빨간 선: 포인터/손가락 궤적을 1개의 선으로, 꺾이는 지점에서 각지게 ---- */
/*   PC → 마우스를 따라 상시 / 모바일 → 손가락 드래그 중에 그려짐          */
(function(){
  const fine=matchMedia("(hover:hover) and (pointer:fine)").matches;
  const svg=document.getElementById("line-cursor");
  if(!svg)return;
  const poly=svg.querySelector("polyline"),head=svg.querySelector(".lc-head");
  if(fine)document.body.classList.add("has-cursor"); // 기본 커서 숨김은 PC만
  const pts=[];            // {x,y,t}
  const TAIL=14;           // 선을 이루는 최대 꼭짓점 수
  const LIFE=340;          // 각 점 수명(ms) → 멈추면 선이 짧아짐
  const MINSEG=6;          // 이 거리 이상 움직였을 때만 새 꼭짓점(각지게)
  let mx=innerWidth/2,my=innerHeight/2,have=false,raf=null;
  function push(x,y){
    mx=x;my=y;have=true;
    const last=pts[pts.length-1];
    if(!last||Math.hypot(mx-last.x,my-last.y)>=MINSEG){
      pts.push({x:mx,y:my,t:performance.now()});
      if(pts.length>TAIL)pts.shift();
    }else{last.x=mx;last.y=my;last.t=performance.now();}
    kick();
  }
  function draw(){
    const now=performance.now();
    while(pts.length&&now-pts[0].t>LIFE)pts.shift();
    if(have){head.setAttribute("cx",mx);head.setAttribute("cy",my)}
    const all=pts.concat(have?[{x:mx,y:my}]:[]);
    poly.setAttribute("points",all.map(p=>p.x+","+p.y).join(" "));
    if(pts.length>0){raf=requestAnimationFrame(draw)}else{raf=null;if(!have){head.setAttribute("cx",-10);head.setAttribute("cy",-10)}}
  }
  function kick(){if(!raf)raf=requestAnimationFrame(draw)}
  function clear(){pts.length=0;have=false;poly.setAttribute("points","");head.setAttribute("cx",-10);head.setAttribute("cy",-10)}
  // PC
  addEventListener("mousemove",e=>push(e.clientX,e.clientY),{passive:true});
  addEventListener("mousedown",e=>{if(INK){const [x,y]=INK.toLocal(e.clientX,e.clientY);INK.splash(x,y,1.0,1)}});
  document.addEventListener("mouseleave",clear);
  // 모바일: 손가락 드래그 궤적을 빨간 선으로, 처음 닿을 때 번짐
  addEventListener("touchstart",e=>{const t=e.touches[0];if(!t)return;push(t.clientX,t.clientY);
    if(INK){const [x,y]=INK.toLocal(t.clientX,t.clientY);INK.splash(x,y,1.1,1)}},{passive:true});
  addEventListener("touchmove",e=>{const t=e.touches[0];if(!t)return;push(t.clientX,t.clientY)},{passive:true});
  addEventListener("touchend",()=>{have=false;kick()},{passive:true});
})();

/* ---- 키로 마스코트: 점 눈이 마우스를 따라 움직임, 클릭하면 깜빡 + 번짐 ---- */
(function(){
  const box=document.getElementById("kiro");if(!box)return;
  const eL=document.getElementById("kpL"),eR=document.getElementById("kpR");
  if(!eL||!eR)return;
  // viewBox 240x240 기준 눈 기본 중심
  const eyes=[{el:eL,cx:92,cy:120},{el:eR,cx:148,cy:120}];
  const MAXR=10; // 눈 이동 반경
  let tx=innerWidth/2,ty=0,raf=null;
  function render(){
    const r=box.getBoundingClientRect();
    eyes.forEach(e=>{
      const ex=r.left+r.width*(e.cx/240), ey=r.top+r.height*(e.cy/240);
      const dx=tx-ex, dy=ty-ey, d=Math.hypot(dx,dy)||1;
      const off=Math.min(MAXR, d/16);
      e.el.setAttribute("cx",e.cx+dx/d*off); e.el.setAttribute("cy",e.cy+dy/d*off);
    });
    raf=null;
  }
  function kick(){if(!raf)raf=requestAnimationFrame(render)}
  addEventListener("mousemove",e=>{tx=e.clientX;ty=e.clientY;kick()},{passive:true});
  addEventListener("touchmove",e=>{const t=e.touches[0];if(t){tx=t.clientX;ty=t.clientY;kick()}},{passive:true});
  // 클릭 → 눈 깜빡(납작) + 민트 번짐
  box.addEventListener("click",()=>{
    eyes.forEach(e=>e.el.setAttribute("ry","2"));
    setTimeout(()=>eyes.forEach(e=>e.el.removeAttribute("ry")),150);
    if(INK){const r=box.getBoundingClientRect();const [x,y]=INK.toLocal(r.left+r.width/2,r.top+r.height/2);INK.splash(x,y,1.0,0)}
  });
  render();
})();

/* ---- 다크 / 화이트 모드 토글 ---- */
(function(){
  const btn=document.getElementById("themeBtn");if(!btn)return;
  const root=document.documentElement,mq=matchMedia("(prefers-color-scheme:dark)");
  const metaL=document.querySelector('meta[name="theme-color"][media*="light"]');
  const metaD=document.querySelector('meta[name="theme-color"][media*="dark"]');
  function stored(){try{return localStorage.getItem("gangneung-theme")}catch{return null}}
  function isDark(){const t=root.getAttribute("data-theme");return t?t==="dark":mq.matches}
  function sync(){
    // 모바일 주소창 색을 현재 테마에 맞춰 강제
    const dark=isDark();
    if(metaL)metaL.setAttribute("media",dark?"not all":"(prefers-color-scheme:light)");
    if(metaD)metaD.setAttribute("media",dark?"all":"(prefers-color-scheme:dark)");
    btn.setAttribute("aria-pressed",String(dark));
  }
  btn.addEventListener("click",()=>{
    const next=isDark()?"light":"dark";
    root.setAttribute("data-theme",next);
    try{localStorage.setItem("gangneung-theme",next)}catch{}
    sync();
  });
  mq.addEventListener&&mq.addEventListener("change",()=>{if(!stored())sync()});
  sync();
})();

/* ---- 오늘의 강릉 날씨 (Open-Meteo, 키 불필요) ---- */
(function(){
  const el=document.getElementById("weather");if(!el)return;
  const emoEl=document.getElementById("wxEmo"),tEl=document.getElementById("wxTemp"),dEl=document.getElementById("wxDesc");
  // WMO weather code → [이모지, 한국어 설명]
  function wmo(c,isDay){
    const sun=isDay?"☀️":"🌙";

  // 바다 라벨
  svg+=`<text class="sea-l" x="${W-30}" y="${H*0.5}" text-anchor="end">동해</text>`;
  for(const [n,a,g] of REFS){const x=X(g),y=Y(a);if(x>-20&&x<W+20&&y>-10&&y<H+10)svg+=`<circle cx="${x}" cy="${y}" r="1.8" fill="var(--map-ink)" opacity=".4"/><text class="ref" x="${x+6}" y="${y-5}">${n}</text>`}
  // 동선 — 얇은 점선 (미니멀)
  const dl=mapDay==="all"?days.filter(d=>d):[+mapDay].filter(d=>d);
  for(const d of dl){const st=routeStops(d);if(st.length>1)svg+=`<polyline points="${st.map(p=>{const q=pos(p);return q.x+","+q.y}).join(" ")}" fill="none" stroke="${DAYC(d)}" stroke-width="1.4" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`}
  // 마커 — 작게
  const order=p=>{const d=effDay(p);return d?dayStops(d).indexOf(p)+1:""};
  const label=shown.length<=14;
  for(const p of shown){
    const q=pos(p),x=q.x,y=q.y,d=effDay(p),sel=openId===p.id;
    if(q.far){const right=x>W/2,dist=Math.round(km({lat:cLat,lng:cLng},p));
      const fr=(7*MB).toFixed(1),ffs=(8.5*MB).toFixed(1),foff=(3*MB).toFixed(1),flab=(12*MB).toFixed(0);
      svg+=`<g class="mk" data-pid="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)} 열기 (지도 밖)">
      <circle cx="${x}" cy="${y}" r="${fr}" fill="var(--map-bg)" stroke="${d?DAYC(d):"var(--d0)"}" stroke-width="1.4" stroke-dasharray="2 2"/>
      <text x="${x}" y="${+y+ +foff}" text-anchor="middle" font-size="${ffs}" font-weight="700" fill="${d?DAYC(d):"var(--d0)"}">${isStay(p)?"숙":d?order(p):"?"}</text>
      <text class="pl" x="${right?x- +flab:+x+ +flab}" y="${+y+ +foff}" text-anchor="${right?"end":"start"}">${esc(p.name)} · 약 ${dist}km 밖</text></g>`;continue}
    if(isStay(p)){const sc=MB,hw=8*sc,ht=9*sc,hb=7*sc,lab=(11*sc).toFixed(0),fo=(3*sc).toFixed(1);
      svg+=`<g class="mk" data-pid="${p.id}" tabindex="0" role="button" aria-label="숙소 ${esc(p.name)} 열기">
      <path d="M${x} ${y-ht} L${+x+hw} ${y-1} L${+x+hb-1} ${y-1} L${+x+hb-1} ${+y+hb} L${x-hb+1} ${+y+hb} L${x-hb+1} ${y-1} L${x-hw} ${y-1} Z" fill="var(--map-ink)" stroke="var(--map-bg)" stroke-width="1.5" stroke-linejoin="round"/>
      <text class="pl" x="${+x+ +lab}" y="${+y+ +fo}">${esc(p.name)}</text></g>`;continue}
    const r=((sel?9:6.5)*MB).toFixed(1),fs=(8.5*MB).toFixed(1),fo=(3*MB).toFixed(1),lab=(11*MB).toFixed(0);
    svg+=`<g class="mk" data-pid="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)} 열기">
      <circle cx="${x}" cy="${y}" r="${r}" fill="${d&&!p.cand?DAYC(d):"var(--map-bg)"}" stroke="${d?(p.cand?DAYC(d):"#fff"):"var(--d0)"}" stroke-width="1.5" ${p.cand?'stroke-dasharray="2 2"':""}/>
      <text x="${x}" y="${+y+ +fo}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${d&&!p.cand?"#fff":(d?DAYC(d):"var(--d0)")}">${d&&!p.cand?order(p):"?"}</text>
      ${label||sel?`<text class="pl" x="${+x+ +lab}" y="${+y+ +fo}">${esc(p.name)}${p.approx?" (대략)":""}</text>`:""}</g>`;
  }
  // 축척
  const pk=s/111;let sk=[0.5,1,2,5,10].find(v=>v*pk>=60)||10;const bw=sk*pk;
  svg+=`<g transform="translate(16 ${H-16})"><rect x="-6" y="-15" width="${bw+46}" height="23" rx="5" fill="var(--map-bg)" opacity=".8"/><line x1="0" y1="0" x2="${bw}" y2="0" stroke="var(--map-ink)" stroke-width="1.5"/><line x1="0" y1="-3" x2="0" y2="0" stroke="var(--map-ink)" stroke-width="1.5"/><line x1="${bw}" y1="-3" x2="${bw}" y2="0" stroke="var(--map-ink)" stroke-width="1.5"/><text x="${bw+6}" y="3.5" font-size="11" fill="var(--map-ink)">${sk} km</text></g>`;
  if(!shown.length)svg+=`<text x="${W/2}" y="${H/2+60}" text-anchor="middle" font-size="13" fill="var(--map-ink)" opacity=".6">${places.length?"이 날에는 위치가 확인된 장소가 없어요":"장소를 추가하면 여기에 표시돼요"}</text>`;
  $("#map").innerHTML=svg+"</svg>";
  if(typeof applyZoom==="function")applyZoom(); // 재렌더 후 줌 상태 유지

  const missing=places.filter(p=>!okCoord(p.lat,p.lng));

  const canAuto=sample&&!readOnly&&missing.some(p=>!isStay(p))&&!finding.length;
  $("#mapNote").innerHTML=missing.length

    :"같은 날 장소는 시간순으로 이어져요. 강릉 밖 장소는 지도 가장자리에 방향과 거리로 표시돼요. 거리는 직선 거리예요.";
}
async function locate(id,name,explicit){
  if(!sample){if(explicit)toast("Claude 사용이 허용되지 않아 위치를 찾을 수 없어요.");return}
  const p=places.find(x=>x.id===id)||{};
  busy["loc"+id]=true;if(openId===id)render();else renderMap();
  const ctx=[p.cat&&`종류: ${p.cat}`,p.memo&&`메모: ${p.memo}`,p.info?.area&&`위치 설명: ${p.info.area}`].filter(Boolean).join("\n");
  try{
    const r=await sample.json(`강릉 여행 일정에 넣은 장소 "${name}"의 위도와 경도를 알려줘.
${ctx}
- 정확히 아는 곳이면 그 좌표를 주고 precision은 "exact".
- 정확한 위치는 모르지만 동네나 지역을 짐작할 수 있으면(이름, 메모, 주소, 종류로 판단) 그 동네 중심 좌표를 주고 precision은 "area".
- 전혀 짐작이 안 되면 강릉 시내 중심(강릉역 근처) 좌표를 주고 precision은 "guess".
- 휴게소처럼 강릉 밖 장소일 수도 있어. 같은 이름이 여러 곳이면 강릉 근처나 서울-강릉 가는 길을 골라.
오직 JSON 객체 하나로만 답해: {"lat":37.78,"lng":128.9,"precision":"exact"}`);
    if(r&&okCoord(+r.lat,+r.lng)){
      const approx=r.precision==="exact"?false:(r.precision==="area"?"area":"guess");
      await patch(id,{lat:+r.lat,lng:+r.lng,approx,pinned:false});
      if(explicit)toast(approx===false?`${name} 위치를 찍었어요`:approx==="area"?`${name}: 동네 기준 대략 위치로 찍었어요`:`${name}: 위치를 몰라서 강릉 시내에 임시로 찍었어요`);
    }else if(explicit)toast("위치를 찾지 못했어요. '직접 찍기'로 지도에서 눌러 주세요.");
  }catch(e){
    if(e?.code==="not_granted"){sample=null;toast("Claude 사용을 허용하면 위치를 자동으로 찾아요.")}
    else if(explicit)toast(e?.code==="rate_limited"?"요청이 많아요. 잠시 후 다시 눌러 주세요.":"위치를 찾지 못했어요. 다시 눌러 주세요.");
  }
  finally{busy["loc"+id]=false;if(openId===id)render();else renderMap()}
}

async function addPlace(name,cat,day,time,memo,cand){
  name=name.trim(); if(!name)return;
  if(!db){toast("공유 저장소에 연결되지 않아 추가할 수 없어요.");return}
  const doc={name,cat,day,time:time||"",memo:memo||"",createdAt:Date.now()};
  if(cand)doc.cand=true;
  if(myId)doc.by=myId;
  const c=known(name);if(c){doc.lat=c[0];doc.lng=c[1]}
  try{const ref=await db.collection("places").add(doc);toast(`${name} 추가했어요`);if(!c&&cat!=="숙소")locate(ref.id,name)}
  catch(e){handleWriteErr(e)}
}
function handleWriteErr(e){
  if(e?.code==="invalid_argument"){readOnly=true;render();toast("보기 권한만 있어서 수정할 수 없어요.")}
  else if(e?.code==="quota_exceeded")toast("저장 공간이 가득 찼어요. 안 쓰는 장소를 지워 주세요.");
  else toast("저장하지 못했어요. 잠시 후 다시 시도해 주세요.");
}

async function getInfo(p){
  busy[p.id]=true;render();
  const prompt=`강원도 강릉 여행을 계획하고 있어. 장소: "${p.name}" (종류: ${p.cat}).
이 장소에 대해 여행자에게 도움이 되는 정보를 한국어로 간단히 정리해 줘. 잘 모르거나 불확실한 항목은 빈 문자열로 두고 지어내지 마.
오직 이 JSON 객체 하나로만 답해:
{"summary":"어떤 곳인지 1~2문장","area":"대략적인 위치/동네와 근처 명소","hours":"일반적인 운영 시간이나 추천 방문 시간대","cost":"입장료나 1인 예상 비용","stay":"보통 머무는 시간","tip":"알아두면 좋은 팁 1~2개","lat":37.78,"lng":128.9}
lat/lng는 대략적인 위도·경도 숫자이고, 모르면 null로 둬.`;
  try{
    const r=await sample.json(prompt,{modelTier:"default"});
    const info={};["summary","area","hours","cost","stay","tip"].forEach(k=>{if(r&&typeof r[k]==="string"&&r[k].trim())info[k]=r[k].trim().slice(0,400)});
    info.at=Date.now();
    const up={info};if(!p.pinned&&!isStay(p)&&r&&okCoord(+r.lat,+r.lng)){up.lat=+r.lat;up.lng=+r.lng;up.approx=false}
    await patch(p.id,up);
    if(!up.lat&&!okCoord(p.lat,p.lng)&&!isStay(p))locate(p.id,p.name,true);
  }catch(e){
    const m={not_granted:"Claude 사용을 허용해야 정보를 받을 수 있어요.",rate_limited:"요청이 많아요. 잠시 후 다시 눌러 주세요.",invalid_json:"정보를 정리하지 못했어요. 다시 눌러 주세요.",refused:"이 장소 정보는 받을 수 없었어요."};
    toast(m[e?.code]||"정보를 받지 못했어요. 다시 시도해 주세요.");
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code))sample=null;
  }finally{busy[p.id]=false;render()}
}

/* ---- 지도 확대·축소 (모바일 핀치/더블탭 + 버튼) ---- */
const mapZoom={s:1,tx:0,ty:0};
function clampZoom(){
  mapZoom.s=Math.max(1,Math.min(4,mapZoom.s));
  const wrap=$("#map").parentElement, W=wrap?wrap.clientWidth:0, H=wrap?wrap.clientHeight:0;
  const maxX=W*(mapZoom.s-1), maxY=H*(mapZoom.s-1);
  mapZoom.tx=Math.min(0,Math.max(-maxX,mapZoom.tx));
  mapZoom.ty=Math.min(0,Math.max(-maxY,mapZoom.ty));
}
function applyZoom(){
  const svg=$("#map svg");if(!svg)return;
  clampZoom();
  svg.style.transform=`translate(${mapZoom.tx}px,${mapZoom.ty}px) scale(${mapZoom.s})`;
  $("#map").classList.toggle("zoomed",mapZoom.s>1.01);
}
function zoomAt(cx,cy,factor){
  // 화면상의 (cx,cy)를 기준으로 확대/축소 (wrap 좌표계)
  const wrap=$("#map").parentElement;if(!wrap)return;
  const r=wrap.getBoundingClientRect(), px=cx-r.left, py=cy-r.top;
  const s0=mapZoom.s, s1=Math.max(1,Math.min(4,s0*factor));
  // 기준점이 고정되도록 translate 보정
  mapZoom.tx=px-(px-mapZoom.tx)*(s1/s0);
  mapZoom.ty=py-(py-mapZoom.ty)*(s1/s0);
  mapZoom.s=s1;
  if(mapZoom.s<=1.01){mapZoom.s=1;mapZoom.tx=0;mapZoom.ty=0;}
  applyZoom();
}
(function(){
  const wrap=$("#map").parentElement;if(!wrap)return;
  let pts=new Map(),startDist=0,startS=1,lastMid=null,moved=false,lastTap=0;
  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
  function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
  wrap.addEventListener("pointerdown",e=>{
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
    if(pts.size===2){const[a,b]=[...pts.values()];startDist=dist(a,b);startS=mapZoom.s;lastMid=mid(a,b);}
  });
  wrap.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return;
    const prev=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){
      const[a,b]=[...pts.values()];const d=dist(a,b),m=mid(a,b);
      if(startDist>0){const f=(d/startDist)/(mapZoom.s/startS);zoomAt(m.x,m.y,f);}
      if(lastMid){mapZoom.tx+=m.x-lastMid.x;mapZoom.ty+=m.y-lastMid.y;applyZoom();}
      lastMid=m;moved=true;e.preventDefault();
    }else if(pts.size===1&&mapZoom.s>1.01){
      mapZoom.tx+=e.clientX-prev.x;mapZoom.ty+=e.clientY-prev.y;applyZoom();moved=true;e.preventDefault();
    }
  });
  function up(e){
    pts.delete(e.pointerId);
    if(pts.size<2){startDist=0;lastMid=null;}
    // 더블탭 토글 (손가락 1개, 이동 없음)
    if(e.pointerType!=="mouse"&&!moved){
      const now=Date.now();
      if(now-lastTap<300){zoomAt(e.clientX,e.clientY,mapZoom.s>1.01?0.01:2.2);lastTap=0;}
      else lastTap=now;
    }
  }
  wrap.addEventListener("pointerup",up);
  wrap.addEventListener("pointercancel",up);
  // 데스크탑: 휠로 확대/축소 (Ctrl 없이도)
  wrap.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15);},{passive:false});
  // 버튼
  const zin=document.getElementById("mzIn"),zout=document.getElementById("mzOut");
  function btnZoom(f){const r=wrap.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f);}
  if(zin)zin.addEventListener("click",()=>btnZoom(1.4));
  if(zout)zout.addEventListener("click",()=>btnZoom(1/1.4));
})();

// 화면 코드가 쓰는 db / sample 인터페이스를 Firebase 모양으로 흉내 내서, 위쪽 코드는 그대로 둡니다.
const CFG=window.APP_CONFIG||{};
const SB_URL=(CFG.supabaseUrl||"").replace(/\/+$/,"");
const SB_KEY=CFG.supabaseAnonKey||"";
const REST=SB_URL+"/rest/v1";
const POLL_MS=CFG.pollMs||4000;
// 편집 암호: config.js 의 editKey 가 있으면, 사용자가 같은 값을 한 번 입력해야 편집 가능 (브라우저에 기억)
const APP_EDIT_KEY=(CFG.editKey||"").trim();
const KEY_STORE="gangneung-edit-key";
function getKey(){try{return localStorage.getItem(KEY_STORE)||""}catch{return ""}}
function setKey(v){try{v?localStorage.setItem(KEY_STORE,v):localStorage.removeItem(KEY_STORE)}catch{}}
let needKey=!!APP_EDIT_KEY;
// 쓰기 전에 편집 암호 확인 (클라이언트 측 간단 잠금). 읽기는 누구나.
function ensureEditAllowed(){
  if(!APP_EDIT_KEY)return true;
  if(getKey()===APP_EDIT_KEY)return true;
  const v=window.prompt("편집하려면 편집 암호를 입력해 주세요.");
  if(v&&v.trim()===APP_EDIT_KEY){setKey(v.trim());return true}
  if(v!==null)toast("편집 암호가 맞지 않아요.");
  throw {code:"invalid_argument",message:"편집 암호가 필요해요."};
}
// Supabase REST 호출
async function sb(method,pathAndQuery,body,extraHeaders){
  if(!SB_URL||!SB_KEY)throw {code:"unavailable",message:"Supabase 설정이 없어요."};
  const headers={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"content-type":"application/json",...(extraHeaders||{})};
  let r;
  try{r=await fetch(REST+pathAndQuery,{method,headers,body:body?JSON.stringify(body):undefined})}
  catch{throw {code:"unavailable",message:"서버에 연결할 수 없어요."}}
  if(r.status===401||r.status===403)throw {code:"invalid_argument",message:"권한이 없어요. (키/정책 확인)"};
  if(!r.ok){let m="오류 "+r.status;try{m=(await r.json()).message||m}catch{}throw {code:"upstream_error",message:m}}
  if(r.status===204)return null;
  try{return await r.json()}catch{return null}
}

// 상태 폴링: places 테이블과 trip(1행)을 주기적으로 읽어 구독자에게 전달
const subs={places:[],trip:[]};let pollTimer=null;
async function refresh(){
  try{
    const [placesRows,tripRows]=await Promise.all([
      sb("GET","/places?select=*&order=created_at.asc"),
      sb("GET","/trip?id=eq.1&select=*"),
    ]);
    sample=null; // Supabase 버전은 AI(Claude) 기능 없음
    const t=(tripRows&&tripRows[0])||{};
    const tripSnap={exists:true,data:()=>({days:t.days??2,start:t.start||""})};
    // DB 행(snake/ JSON) → 화면이 쓰는 모양으로
    const placeSnap={docs:(placesRows||[]).map(row=>({
      id:row.id,
      data:()=>({
        name:row.name,cat:row.cat,day:row.day,time:row.time||"",memo:row.memo||"",
        lat:row.lat??undefined,lng:row.lng??undefined,
        pinned:row.pinned||undefined,cand:row.cand||undefined,approx:row.approx??undefined,
        by:row.by||undefined,createdAt:row.created_at?Date.parse(row.created_at):undefined,
        info:row.info||undefined,
      }),
    }))};
    subs.trip.forEach(f=>f(tripSnap));subs.places.forEach(f=>f(placeSnap));
    if(!readOnly)$("#status").textContent=`함께 보는 중 · ${(placesRows||[]).length}곳`;
  }catch(e){$("#status").textContent="서버에 연결할 수 없어요. 잠시 후 다시 시도해요.";}
}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(()=>{if(!document.hidden)refresh()},POLL_MS)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
const after=(p)=>p.then(v=>{refresh();return v});

// 화면 코드가 쓰는 필드 → DB 컬럼으로 변환 (createdAt→created_at 등)
function toRow(doc){
  const r={};
  if("name" in doc)r.name=doc.name;
  if("cat" in doc)r.cat=doc.cat;
  if("day" in doc)r.day=doc.day;
  if("time" in doc)r.time=doc.time;
  if("memo" in doc)r.memo=doc.memo;
  if("lat" in doc)r.lat=doc.lat;
  if("lng" in doc)r.lng=doc.lng;
  if("pinned" in doc)r.pinned=doc.pinned;
  if("cand" in doc)r.cand=doc.cand;
  if("approx" in doc)r.approx=doc.approx;
  if("by" in doc)r.by=doc.by;
  if("info" in doc)r.info=doc.info;
  if("createdAt" in doc)r.created_at=new Date(doc.createdAt).toISOString();
  return r;
}
function makeDb(){
  return {
    collection(name){
      if(name!=="places")throw new Error("unknown collection "+name);
      return {
        add:(doc)=>{ensureEditAllowed();return after(
          sb("POST","/places",toRow(doc),{Prefer:"return=representation"})
        ).then(rows=>({id:rows&&rows[0]&&rows[0].id}))},
        doc:(id)=>({
          update:(data)=>{ensureEditAllowed();return after(
            sb("PATCH","/places?id=eq."+encodeURIComponent(id),toRow(data)))},
          delete:()=>{ensureEditAllowed();return after(
            sb("DELETE","/places?id=eq."+encodeURIComponent(id)))},
        }),
        onSnapshot:(next)=>{subs.places.push(next);return()=>{}},
      };
    },
    doc(path){
      if(path!=="meta/trip")throw new Error("unknown doc "+path);
      return {
        set:(data)=>{ensureEditAllowed();return after(
          sb("POST","/trip?on_conflict=id",{id:1,days:data.days,start:data.start||null},
             {Prefer:"resolution=merge-duplicates"}))},
        onSnapshot:(next)=>{subs.trip.push(next);return()=>{}},
      };
    },
  };
}

(async()=>{
  if(!SB_URL||!SB_KEY||SB_URL.includes("xxxxxxxx")){
    $("#status").textContent="config.js 에 Supabase URL/키를 넣어 주세요.";$("#addBtn").disabled=true;return;
  }
  db=makeDb();sample=null;user=null;
  db.doc("meta/trip").onSnapshot(s=>{
    if(s.exists){const d=s.data();trip.days=2;trip.start=d.start||"";
      if(document.activeElement!==$("#start"))$("#start").value=trip.start;}
    renderForm();render();
  });
  db.collection("places").onSnapshot(s=>{
    places=s.docs.map(d=>({id:d.id,...d.data()}));
    if(!readOnly)$("#status").textContent=`함께 보는 중 · ${places.length}곳`;
    const a=document.activeElement;if(a&&a.dataset&&(a.dataset.f==="memo"||a.dataset.f==="time"))return;
    render();
  });
  await refresh();startPolling();
})();
</script>
