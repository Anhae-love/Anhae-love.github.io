<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>강릉 여행 계획</title>
<meta name="theme-color" content="#F7F9FB" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#141C22" media="(prefers-color-scheme:dark)">
<script>
/* 테마를 CSS 적용 전에 먼저 지정해 깜빡임 방지 */
(function(){try{var t=localStorage.getItem("gangneung-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: 한 줄 헤더 + 장소 추가 바 + 일차별 세로 타임라인(넓은 화면에선 열로 나란히) */
/* ===== v2 · d.school 감각: 흰 바탕 + 소색/회색 + 블랙 글씨, 가끔 민트, 빨간 선 커서 ===== */
:root{
  /* 라이트 — 순백 배경, 블랙 텍스트, 소색/회색 중간톤 */
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#111111; --muted:#6B6B6E; --line:#E6E4DF;
  --sea:#111111; --sea-soft:#F3F1EC; --pine:#4B4B4E; --pine-soft:#F1F0EC; --sun:#6B6B6E; --sun-soft:#F3F1EC;
  --danger:#E23B2E; /* 빨강 = 커서 전용 포인트 */
  --land:#F4F2ED; --sea-fill:#ECEAE4; --road:#F0EEE8; --on-dot:#FFFFFF;
  /* 포인트: 평소엔 거의 안 쓰고, 가끔 민트만 확 */
  --mint:#17B9A6; --mint-weak:#E2F6F2;
  --accent:#111111; --accent-weak:#F2F1EC;  /* 기본 인터랙션은 블랙/소색, 민트는 선택적 */
  --red:#E23B2E;
  /* 동선(일차): 소색 계열, 구분만 */
  --d0:#C3C1BA; --d1:#111111; --d2:#9A9893;
  --grad:linear-gradient(180deg,#FFFFFF 0%,#FBFAF7 100%);
  --ink-rgb:17,17,17;
  --blot1:23,185,166;   /* 민트 (가끔) */
  --blot2:226,59,46;    /* 빨강 (클릭 포인트) */
  --paper:#FFFFFF;
  --display:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --body:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif;
  --shadow-sm:0 1px 3px rgba(17,17,17,.05);
  --shadow-md:0 8px 24px rgba(17,17,17,.09);
}
/* 다크 — 소색이 빠진 차콜, 글씨 흰색, 같은 민트/빨강 포인트 */
:root[data-theme="dark"]{
  --bg:#121211; --surface:#1A1A18; --ink:#F3F1EC; --muted:#9C9A94; --line:#2C2B28;
  --sea:#F3F1EC; --sea-soft:#242320; --pine:#C4C2BB; --pine-soft:#242320; --sun:#9C9A94; --sun-soft:#201F1D;
  --danger:#FF5648;
  --land:#1A1A18; --sea-fill:#232220; --road:#1E1E1C; --on-dot:#121211;
  --mint:#2DD4BF; --mint-weak:#17322E;
  --accent:#F3F1EC; --accent-weak:#242320;
  --red:#FF5648;
  --d0:#565550; --d1:#F3F1EC; --d2:#9C9A94;
  --grad:linear-gradient(180deg,#141413 0%,#101010 100%);
  --ink-rgb:243,241,236;
  --blot1:45,212,191;
  --blot2:255,86,72;
  --paper:#121211;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 10px 28px rgba(0,0,0,.55);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121211; --surface:#1A1A18; --ink:#F3F1EC; --muted:#9C9A94; --line:#2C2B28;
  --sea:#F3F1EC; --sea-soft:#242320; --pine:#C4C2BB; --pine-soft:#242320; --sun:#9C9A94; --sun-soft:#201F1D;
  --danger:#FF5648;
  --land:#1A1A18; --sea-fill:#232220; --road:#1E1E1C; --on-dot:#121211;
  --mint:#2DD4BF; --mint-weak:#17322E;
  --accent:#F3F1EC; --accent-weak:#242320;
  --red:#FF5648;
  --d0:#565550; --d1:#F3F1EC; --d2:#9C9A94;
  --grad:linear-gradient(180deg,#141413 0%,#101010 100%);
  --ink-rgb:243,241,236;
  --blot1:45,212,191;
  --blot2:255,86,72;
  --paper:#121211;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 10px 28px rgba(0,0,0,.55);
  color-scheme:dark;
}}
*{box-sizing:border-box}
body{background:var(--paper);background-image:var(--grad);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.62;-webkit-font-smoothing:antialiased;letter-spacing:0;position:relative;min-height:100vh;transition:background-color .4s ease,color .4s ease}
/* 먹 번짐 캔버스: 가운데에서 계속 번지고, 마우스/터치에 반응 */
#ink{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none;opacity:.9}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 60px;display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:1px solid var(--line);padding-bottom:18px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(19px,2.6vw,23px);line-height:1.3;margin:0;text-wrap:balance;letter-spacing:.01em;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px}
h1 small{flex-basis:100%;display:block;font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--muted);margin-bottom:5px}
h1 .title-main{color:var(--ink)}
/* 하슬라 캐릭터 — 본문 제목보다 한 단계 작게, 민트 포인트 */
h1 .buddy{font-family:var(--display);font-weight:700;font-size:.62em;letter-spacing:.01em;color:var(--mint);
  display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;
  background:var(--mint-weak);border:1px solid color-mix(in srgb,var(--mint) 35%,transparent)}
h1 .buddy::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 25%,transparent)}
.trip{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.trip label{display:flex;align-items:center;gap:6px}
.trip input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.trip input[type=number]{width:60px}
.status{font-size:12px;color:var(--muted)}

/* 날씨 + 테마 토글 */
.hbar{display:flex;align-items:center;gap:8px}
.weather{display:inline-flex;align-items:center;gap:10px;background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink);box-shadow:var(--shadow-sm);white-space:nowrap}
.weather .wx-now,.weather .wx-tmr{display:inline-flex;align-items:center;gap:6px}
.weather .wx-tmr{padding-left:10px;border-left:1px solid var(--line);color:var(--muted)}
.weather .wx-tl{font-size:11px;opacity:.85}
.weather .wx-emo{font-size:16px;line-height:1}
.weather .wx-temp{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.weather .wx-tt{font-variant-numeric:tabular-nums}
.weather .wx-desc{color:var(--muted)}
.weather.loading .wx-tmr{display:none}
.weather.loading{color:var(--muted)}
.themebtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);box-shadow:var(--shadow-sm);transition:border-color .2s,transform .2s;flex:none}
.themebtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.themebtn svg{width:18px;height:18px}
.themebtn .ic-sun{display:none}
.themebtn .ic-moon{display:block}
:root[data-theme="dark"] .themebtn .ic-sun{display:block}
:root[data-theme="dark"] .themebtn .ic-moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .themebtn .ic-sun{display:block}:root:not([data-theme="light"]) .themebtn .ic-moon{display:none}}

.add{background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm)}
.add form{display:grid;grid-template-columns:2fr 1fr 1fr 90px 2fr auto auto;gap:8px}
.fcand{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;border:1px solid var(--line);border-radius:8px;padding:0 10px;cursor:pointer;transition:border-color .15s,color .15s}
.fcand:has(input:checked){border-color:var(--accent);color:var(--accent)}
.add input,.add select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;transition:border-color .15s}
.add input:focus,.add select:focus{border-color:var(--accent);outline:none}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-weight:600;white-space:nowrap;transition:filter .2s,box-shadow .2s;box-shadow:var(--shadow-sm)}
.btn:hover:not(:disabled){filter:brightness(1.06);box-shadow:var(--shadow-md)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-size:13px;color:var(--ink);transition:border-color .2s,color .2s,background .2s}
.ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.ideas{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.ideas span.lbl{color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 12px;font-size:13px;color:var(--ink);transition:border-color .15s,color .15s,background .15s}
.chip:hover{border-color:var(--mint);color:var(--mint);background:var(--mint-weak);transform:translateY(-1px)}
@media (max-width:820px){.add form{grid-template-columns:1fr 1fr}.add form .name,.add form .memo{grid-column:1/-1}.add form .btn{grid-column:1/-1}.fcand{padding-block:8px}}

.board{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.day{display:flex;flex-direction:column;gap:8px;min-width:0}
.day h2{font-family:var(--display);font-weight:800;font-size:15px;margin:0;display:flex;align-items:baseline;gap:8px;letter-spacing:.01em}
.day h2 .date{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.day h2 .n{margin-left:auto;font-family:var(--body);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.day.undecided h2{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--line);padding-left:12px;min-height:44px}
.empty{font-size:13px;color:var(--muted);padding:10px 0}

.card{background:var(--surface);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;min-width:0;transition:border-color .2s,box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:color-mix(in srgb,var(--mint) 45%,var(--line))}
.card.open{border-color:var(--ink);box-shadow:var(--shadow-md)}
/* 1일차 타임라인=민트 포인트, 2일차=소색 */
.day[data-day="1"] .list{border-left-color:color-mix(in srgb,var(--mint) 55%,var(--line))}
.day[data-day="2"] .list{border-left-color:var(--line)}
.day[data-day="1"] h2 .n{color:var(--mint)}
.day[data-day="2"] h2 .n{color:var(--muted)}
.row{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;width:100%;background:none;border:0;text-align:left}
.time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);width:38px;flex:none;padding-top:2px}
.main{flex:1;min-width:0}
.pname{font-weight:600;overflow-wrap:anywhere}
.pmemo{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.card.open .pmemo{white-space:normal;overflow-wrap:anywhere}
.cat{flex:none;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;margin-top:2px}
.c-관광{background:var(--mint-weak);color:color-mix(in srgb,var(--mint) 70%,#000)}
:root[data-theme="dark"] .c-관광{color:var(--mint)}
.c-맛집{background:var(--sun-soft);color:var(--sun)}
.c-카페{background:var(--sun-soft);color:var(--sun)}
.c-숙소{background:var(--land);color:var(--ink)}
.c-기타{background:var(--land);color:var(--muted)}
.cand-b{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.card.cand .pname{color:var(--muted)}
.candrow{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.approx{font-size:12px;color:var(--ink);background:var(--accent-weak);border-radius:8px;padding:6px 8px}
.locbtns{display:inline-flex;align-items:center;gap:6px}
.linkish{background:none;border:0;padding:4px 2px;font-size:12px;color:var(--accent);text-decoration:underline}
.has-info{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:6px;vertical-align:middle}

.detail{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.fields{display:grid;grid-template-columns:1fr 100px;gap:8px}
.fields select,.fields input,.detail textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0;width:100%;transition:border-color .15s}
.fields select:focus,.fields input:focus,.detail textarea:focus{border-color:var(--accent);outline:none}
.detail textarea{resize:vertical;min-height:54px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px;transition:border-color .15s,background .15s}
.links a:hover{border-color:var(--accent);background:var(--accent-weak)}
.info{background:var(--land);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.info dt{color:var(--muted);font-size:12px;white-space:nowrap}
.info dd{margin:0;overflow-wrap:anywhere}
.info .sum{margin:0}
.info .note{font-size:11px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.danger{color:var(--danger);border-color:var(--line)}
.by{font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 4px 12px rgba(17,31,40,.16)}

.mapbox{background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
.maphead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.maphead h2{font-family:var(--display);font-weight:700;font-size:15px;margin:0 8px 0 0;letter-spacing:-0.01em}
.dchip{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 11px;font-size:12px;display:inline-flex;gap:6px;align-items:center;color:var(--ink);font-variant-numeric:tabular-nums;transition:border-color .15s,background .15s}
.dchip:hover{border-color:var(--accent)}
.dchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak);color:var(--accent);font-weight:600}
.dchip .km{color:var(--muted);font-weight:400}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.mapwrap{position:relative;background:var(--land)}
#map svg{display:block;width:100%;height:auto;max-height:72vh}
#map .mk{cursor:pointer}
#map.picking svg{cursor:crosshair;outline:2px solid var(--accent);outline-offset:-2px}
.mapnote button{margin-left:6px}
#map .mk:focus-visible circle{stroke:var(--accent);stroke-width:3}
#map .pl{font-size:12px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round;letter-spacing:-0.01em}
#map .ref{font-size:11px;fill:var(--muted)}
#map .sea-l{font-family:var(--display);font-weight:700;font-size:18px;fill:var(--muted);opacity:.45;letter-spacing:.3em}
.mapnote{font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
@media (max-width:600px){
  html{font-size:94%}
  body{font-size:14px;line-height:1.55}
  .wrap{padding-block:12px 44px;gap:14px}
  header{padding-bottom:12px;gap:10px;flex-direction:column;align-items:stretch}
  h1{font-size:20px}
  h1 small{margin-bottom:2px;font-size:10px}
  .trip{font-size:12px;gap:8px;align-items:center}
  /* 모바일: 날씨·테마 바를 맨 위 한 줄로, 좌우 정렬 */
  .hbar{order:-1;width:100%;justify-content:space-between}
  .weather{flex:1;justify-content:flex-start;padding:6px 12px}
  .trip label{font-size:12px}
  .add{padding:12px;gap:9px;border-radius:14px}
  .add form{grid-template-columns:1fr 1fr 84px auto;gap:6px}
  .add form .name{grid-column:1/-1}
  #fDay{order:1}#fCat{order:2}#fTime{order:3}.fcand{order:4}.add form .memo{order:5}.add form .btn{order:6}
  .add form .memo{grid-column:1/4}
  .add form .btn{grid-column:4/5;padding-inline:14px}
  .add input,.add select{padding:8px 9px;font-size:15px}
  .fcand{padding:0 9px;font-size:13px}
  .ideas{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .ideas::-webkit-scrollbar{display:none}
  .ideas .chip{flex:none}
  .ideas span.lbl{flex:none}
  .board{gap:10px}              /* 모바일에서도 2단 유지 */
  .day{gap:6px}
  .day h2{font-size:14px;flex-wrap:wrap;gap:4px}
  .day h2 .date{font-size:11px}
  .day h2 .n{font-size:11px}
  .list{padding-left:8px;gap:5px}
  .row{padding:7px 9px;gap:6px;flex-wrap:wrap}
  .time{width:100%;font-size:11px;padding-top:0}
  .pname{font-size:13px;line-height:1.35}
  .pmemo{font-size:11px}
  .cat{font-size:10px;padding:1px 6px}
  .card .row .cat{margin-left:auto}
  .detail{padding:11px;gap:9px}
  .mapbox{border-radius:16px}
  .maphead h2{font-size:14px}
  #map svg{max-height:58vh}
}
@media (max-width:380px){
  html{font-size:90%}
  h1{font-size:18px}
  .weather .wx-desc{display:none}
  .add form{grid-template-columns:1fr 84px auto}
  #fCat{grid-column:1/2}#fTime{grid-column:2/3}.fcand{grid-column:3/4;justify-content:center}
  .add form .memo{grid-column:1/3}
  .add form .btn{grid-column:3/4}
}

<script>
/* ====== 먹 번짐 배경 캔버스 (계속 번지고, 마우스/터치에 반응) ====== */
const INK=(function(){
  const cv=document.getElementById("ink");if(!cv)return null;
  const ctx=cv.getContext("2d");
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  let W=0,H=0,dpr=1,blobs=[],t=0,raf=null;
  function cssVar(n,fb){return (getComputedStyle(document.documentElement).getPropertyValue(n).trim()||fb)}
  function blotColor(which,a){ // which: 0=민트,1=보라
    const v=which? cssVar("--blot2","124,92,252") : cssVar("--blot1","20,184,166");
    return `rgba(${v},${a})`;
  }
  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  // 하나의 색 번짐: 중심에서 퍼지며 옅어짐 (c=0 민트 / 1 빨강)
  function spawn(x,y,r,life,c){blobs.push({x,y,r0:r*0.2,r,age:0,life:life||1,c:c==null?0:c})}
  function splash(x,y,power,c){ // 클릭/터치 시 확 번짐
    const n=5+Math.floor(power*4);const col=c==null?0:c;
    for(let i=0;i<n;i++){const a=Math.random()*6.283,d=Math.random()*40*power;
      spawn(x+Math.cos(a)*d,y+Math.sin(a)*d,(24+Math.random()*54)*power,0.9+Math.random()*0.5,col)}
  }
  function frame(dt){
    t+=dt;
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation="source-over";
    // 흰 배경 유지: 아주 가끔, 아주 옅은 민트만 은은하게 피어오름
    if(!reduce&&Math.random()<0.012){const cx=W/2+(Math.random()-0.5)*W*0.4,cy=H*0.5+(Math.random()-0.5)*H*0.4;spawn(cx,cy,60+Math.random()*90,1.6+Math.random(),0)}
    for(let i=blobs.length-1;i>=0;i--){
      const b=blobs[i];b.age+=dt/ (reduce?1600:3200) / b.life;
      if(b.age>=1){blobs.splice(i,1);continue}
      const e=b.age, r=b.r0+(b.r-b.r0)*(1-Math.pow(1-e,2));
      // 민트(c=0)는 아주 옅게, 빨강(c=1, 클릭)만 조금 더 선명하게
      const alpha=(1-e)*(b.c? 0.16 : 0.07);
      const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,r);
      g.addColorStop(0,blotColor(b.c,alpha));
      g.addColorStop(0.55,blotColor(b.c,alpha*0.45));
      g.addColorStop(1,blotColor(b.c,0));
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,r,0,6.283);ctx.fill();
    }
    if(blobs.length>150)blobs.splice(0,blobs.length-150);
  }
  let last=performance.now();
  function loop(now){const dt=Math.min(now-last,60);last=now;frame(dt);raf=requestAnimationFrame(loop)}
  addEventListener("resize",resize,{passive:true});
  resize();
  // 처음에 가운데 한 방울
  spawn(W/2,H*0.5,120,2);
  raf=requestAnimationFrame(loop);
  return {spawn,splash,toLocal:(x,y)=>{const r=cv.getBoundingClientRect();return [x-r.left,y-r.top]}};
})();

/* ---- 빨간 선 커서: 포인터 궤적을 1개의 선으로, 꺾이는 지점에서 각지게 ---- */
(function(){
  const fine=matchMedia("(hover:hover) and (pointer:fine)").matches;
  const svg=document.getElementById("line-cursor");
  if(!fine||!svg)return;
  const poly=svg.querySelector("polyline"),head=svg.querySelector(".lc-head");
  document.body.classList.add("has-cursor");
  // 최근 포인터 지점들을 모아 1개의 선으로. 움직임이 멈추면 꼬리부터 사라짐.
  const pts=[];            // {x,y,t}
  const TAIL=14;           // 선을 이루는 최대 꼭짓점 수 (꺾임점 포함)
  const LIFE=320;          // 각 점이 살아있는 시간(ms) → 멈추면 선이 짧아짐
  const MINSEG=6;          // 이 거리 이상 움직였을 때만 새 꼭짓점(각지게 끊기도록)
  let mx=innerWidth/2,my=innerHeight/2,have=false,raf=null;
  function onMove(e){
    mx=e.clientX;my=e.clientY;have=true;
    const last=pts[pts.length-1];
    if(!last||Math.hypot(mx-last.x,my-last.y)>=MINSEG){
      pts.push({x:mx,y:my,t:performance.now()});
      if(pts.length>TAIL)pts.shift();
    }else{last.x=mx;last.y=my;last.t=performance.now();}
    kick();
  }
  function draw(){
    const now=performance.now();
    // 수명 지난 꼭짓점 제거 → 꼬리부터 사라짐
    while(pts.length&&now-pts[0].t>LIFE)pts.shift();
    if(have){                 // 머리(현재 위치)는 항상 포함
      head.setAttribute("cx",mx);head.setAttribute("cy",my);
    }
    const all=pts.concat(have?[{x:mx,y:my}]:[]);
    poly.setAttribute("points",all.map(p=>p.x+","+p.y).join(" "));
    // 점이 남아있으면 계속 애니메이션(멈춰도 꼬리 소멸까지 돌다가 멈춤)
    if(pts.length>0){raf=requestAnimationFrame(draw)}else raf=null;
  }
  function kick(){if(!raf)raf=requestAnimationFrame(draw)}
  addEventListener("mousemove",onMove,{passive:true});
  // 클릭하면 빨간 번짐 한 번
  addEventListener("mousedown",e=>{if(INK){const [x,y]=INK.toLocal(e.clientX,e.clientY);INK.splash(x,y,1.0,1)}});
  document.addEventListener("mouseleave",()=>{pts.length=0;poly.setAttribute("points","");head.setAttribute("cx",-10);head.setAttribute("cy",-10)});
})();

/* ---- 모바일: 터치하면 색이 확 번짐 (가끔 민트) ---- */
addEventListener("touchstart",e=>{
  if(!INK)return;const tt=e.touches[0];if(!tt)return;

/* ---- 다크 / 화이트 모드 토글 ---- */
(function(){
  const btn=document.getElementById("themeBtn");if(!btn)return;
  const root=document.documentElement,mq=matchMedia("(prefers-color-scheme:dark)");
  const metaL=document.querySelector('meta[name="theme-color"][media*="light"]');
  const metaD=document.querySelector('meta[name="theme-color"][media*="dark"]');
  function stored(){try{return localStorage.getItem("gangneung-theme")}catch{return null}}
  function isDark(){const t=root.getAttribute("data-theme");return t?t==="dark":mq.matches}
  function sync(){
    // 모바일 주소창 색을 현재 테마에 맞춰 강제
    const dark=isDark();
    if(metaL)metaL.setAttribute("media",dark?"not all":"(prefers-color-scheme:light)");
    if(metaD)metaD.setAttribute("media",dark?"all":"(prefers-color-scheme:dark)");
    btn.setAttribute("aria-pressed",String(dark));
  }
  btn.addEventListener("click",()=>{
    const next=isDark()?"light":"dark";
    root.setAttribute("data-theme",next);
    try{localStorage.setItem("gangneung-theme",next)}catch{}
    sync();
  });
  mq.addEventListener&&mq.addEventListener("change",()=>{if(!stored())sync()});
  sync();
})();

/* ---- 오늘의 강릉 날씨 (Open-Meteo, 키 불필요) ---- */
(function(){
  const el=document.getElementById("weather");if(!el)return;
  const emoEl=document.getElementById("wxEmo"),tEl=document.getElementById("wxTemp"),dEl=document.getElementById("wxDesc");
  // WMO weather code → [이모지, 한국어 설명]
  function wmo(c,isDay){
    const sun=isDay?"☀️":"🌙";
    const m={
      0:[sun,"맑음"],1:[isDay?"🌤️":"🌙","대체로 맑음"],2:["⛅","구름 조금"],3:["☁️","흐림"],
      45:["🌫️","안개"],48:["🌫️","짙은 안개"],
      51:["🌦️","약한 이슬비"],53:["🌦️","이슬비"],55:["🌧️","강한 이슬비"],
      56:["🌧️","언 이슬비"],57:["🌧️","언 이슬비"],
      61:["🌦️","약한 비"],63:["🌧️","비"],65:["🌧️","강한 비"],
      66:["🌧️","언 비"],67:["🌧️","언 비"],
      71:["🌨️","약한 눈"],73:["🌨️","눈"],75:["❄️","강한 눈"],77:["🌨️","싸락눈"],
      80:["🌦️","소나기"],81:["🌧️","소나기"],82:["⛈️","강한 소나기"],
      85:["🌨️","소낙눈"],86:["❄️","강한 소낙눈"],
      95:["⛈️","천둥번개"],96:["⛈️","천둥번개·우박"],99:["⛈️","강한 천둥번개"]
    };
    return m[c]||["⛅","-"];
  }
  const tmEmo=document.getElementById("wxTmEmo"),tmT=document.getElementById("wxTmTemp");
  // 강릉 좌표 — 오늘+내일
  const url="https://api.open-meteo.com/v1/forecast?latitude=37.7519&longitude=128.8761&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&forecast_days=2";
  fetch(url).then(r=>r.ok?r.json():Promise.reject()).then(d=>{
    const cur=d.current||{},day=d.daily||{};
    const [emo,desc]=wmo(cur.weather_code,cur.is_day!==0);
    const t=Math.round(cur.temperature_2m);
    const hi=day.temperature_2m_max&&Math.round(day.temperature_2m_max[0]);
    const lo=day.temperature_2m_min&&Math.round(day.temperature_2m_min[0]);
    emoEl.textContent=emo;
    tEl.textContent=(isFinite(t)?t:"–")+"°";
    dEl.textContent=desc+((hi!=null&&lo!=null)?` ${hi}°/${lo}°`:"");
    // 내일
    if(day.weather_code&&day.weather_code.length>1){
      const [emo2,desc2]=wmo(day.weather_code[1],true);
      const hi2=Math.round(day.temperature_2m_max[1]),lo2=Math.round(day.temperature_2m_min[1]);
      if(tmEmo)tmEmo.textContent=emo2;
      if(tmT)tmT.textContent=`${hi2}°/${lo2}°`;
      el.title=`오늘 강릉 ${desc} ${isFinite(t)?t+"°":""} (${hi}°/${lo}°) · 내일 ${desc2} (${hi2}°/${lo2}°)`;
    }
    el.classList.remove("loading");
  }).catch(()=>{
    emoEl.textContent="⛅";tEl.textContent="";dEl.textContent="날씨 정보를 못 받았어요";
    el.classList.remove("loading");
  });
})();

function card(p){
  const open=openId===p.id, i=p.info;
  let h=`<div class="card${open?" open":""}${p.cand?" cand":""}" data-id="${p.id}">
   <button class="row" data-act="toggle" aria-expanded="${open}">
    <span class="time">${esc(p.time||"")}</span>
    <span class="main"><span class="pname">${esc(p.name)}</span>${p.cand?'<span class="cand-b">후보</span>':""}${i?'<span class="has-info" title="정보 있음"></span>':""}
     ${p.memo?`<div class="pmemo">${esc(p.memo)}</div>`:""}</span>
    <span class="cat c-${CATS.includes(p.cat)?p.cat:"기타"}">${esc(p.cat||"기타")}</span>
   </button>`;
  if(open){
    const q=encodeURIComponent("강릉 "+p.name);
    h+=`<div class="detail">
     <div class="fields">
      <select data-f="day" aria-label="일차" ${readOnly?"disabled":""}>${dayOptions(p.day)}</select>
      <input type="time" data-f="time" value="${esc(p.time||"")}" aria-label="시간" ${readOnly?"disabled":""}>
     </div>
     <label class="candrow"><input type="checkbox" data-f="cand" ${p.cand?"checked":""} ${readOnly?"disabled":""}> 후보로 두기 (동선에서 빼기)</label>
     <textarea data-f="memo" placeholder="메모" maxlength="200" ${readOnly?"disabled":""}>${esc(p.memo||"")}</textarea>
     ${p.approx&&okCoord(p.lat,p.lng)?`<div class="approx">${p.approx==="area"?"지도 위치는 동네 기준 대략 위치예요.":"Claude가 이 가게를 몰라서 강릉 시내에 임시로 찍었어요."} 정확한 위치는 '직접 찍기'로 지도에서 눌러 주세요.</div>`:""}
     <div class="links">
      <a href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">네이버 지도</a>
      <a href="https://map.kakao.com/?q=${q}" target="_blank" rel="noopener">카카오맵</a>
      <a href="https://search.naver.com/search.naver?query=${q}" target="_blank" rel="noopener">후기 검색</a>
     </div>`;
    if(i){
      h+=`<div class="info">${i.summary?`<p class="sum">${esc(i.summary)}</p>`:""}<dl>
        ${i.area?`<dt>위치</dt><dd>${esc(i.area)}</dd>`:""}
        ${i.hours?`<dt>운영</dt><dd>${esc(i.hours)}</dd>`:""}
        ${i.cost?`<dt>비용</dt><dd>${esc(i.cost)}</dd>`:""}
        ${i.stay?`<dt>머무는 시간</dt><dd>${esc(i.stay)}</dd>`:""}
        ${i.tip?`<dt>팁</dt><dd>${esc(i.tip)}</dd>`:""}</dl>
        <div class="note">Claude가 정리한 일반 정보예요. 영업시간·가격은 방문 전에 지도 앱에서 확인하세요.</div></div>`;
    }
    h+=`<div class="actions">
      ${readOnly?"":`<span class="locbtns">${sample?`<button class="ghost" data-act="find" ${busy["loc"+p.id]?"disabled":""}>${busy["loc"+p.id]?"위치 찾는 중…":okCoord(p.lat,p.lng)?"위치 다시 찾기":"위치 찾기"}</button>`:""} <button class="linkish" data-act="pick">직접 찍기</button></span>`}
      ${sample&&!isStay(p)?`<button class="ghost" data-act="info" ${busy[p.id]||readOnly?"disabled":""}>${busy[p.id]?"정리하는 중…":i?"정보 다시 받기":"Claude에게 정보 받기"}</button>`:"<span></span>"}
      ${readOnly?"":(busy["del"+p.id]?`<span><button class="ghost danger" data-act="del2">삭제 확인</button> <button class="ghost" data-act="del0">취소</button></span>`:`<button class="ghost danger" data-act="del">삭제</button>`)}
     </div>
     ${p.by&&names[p.by]?`<div class="by">${esc(names[p.by])}님이 추가</div>`:""}
    </div>`;
  }
  return h+"</div>";
}
function render(){
  const cols=[1,2]; // 1일차·2일차만, 2단 고정
  const bd=$("#board");
  bd.innerHTML=cols.map(d=>{
    const items=places.filter(p=>clampDay(p.day)===d).sort((a,b)=>sortKey(a)<sortKey(b)?-1:1);
    const L=dayLabel(d);
    return `<section class="day" data-day="${d}"><h2>${L.t}${L.date?`<span class="date">${L.date}</span>`:""}<span class="n">${items.length}곳</span></h2>
      <div class="list">${items.length?items.map(card).join(""):`<div class="empty">${places.length?"아직 이 날 갈 곳이 없어요.":"위에서 첫 장소를 추가해 보세요."}</div>`}</div></section>`;
  }).join("");
  renderIdeas();
  renderMap();
}
const effDay=p=>clampDay(p.day);
function routeStops(d){return places.filter(p=>effDay(p)===d&&!p.cand&&okCoord(p.lat,p.lng)).sort((a,b)=>sortKey(a)<sortKey(b)?-1:1)}
function dayStops(d){return places.filter(p=>effDay(p)===d&&!isStay(p)&&!p.cand&&okCoord(p.lat,p.lng)).sort((a,b)=>sortKey(a)<sortKey(b)?-1:1)}
function renderMap(){
  // 헤더 칩
  let chips=`<h2>지도</h2><button class="dchip" data-md="all" aria-pressed="${mapDay==="all"}">전체</button>`;
  const days=[1,2];
  for(const d of days){
    const st=routeStops(d);let dist=0;for(let i=1;i<st.length;i++)dist+=km(st[i-1],st[i]);
    chips+=`<button class="dchip" data-md="${d}" aria-pressed="${mapDay===String(d)}"><span class="dot" style="background:${DAYC(d)}"></span>${dayLabel(d).t}${st.length>1?` <span class="km">${dist.toFixed(1)}km</span>`:""}</button>`;
  }
  $("#mapHead").innerHTML=chips;
  if(mapDay!=="all"&&!days.includes(+mapDay))mapDay="all";

  const shown=places.filter(p=>okCoord(p.lat,p.lng)&&(mapDay==="all"||isStay(p)||String(effDay(p))===mapDay));
  const W=800,H=540,k=Math.cos(37.78*Math.PI/180);
  const fit=shown.filter(near);let la=fit.map(p=>p.lat),lo=fit.map(p=>p.lng);
  if(!fit.length||pickId){la=la.concat([37.68,37.90]);lo=lo.concat([128.82,129.05])}
  const cLat=(Math.min(...la)+Math.max(...la))/2,cLng=(Math.min(...lo)+Math.max(...lo))/2;
  const spLat=Math.max(Math.max(...la)-Math.min(...la),0.035),spX=Math.max((Math.max(...lo)-Math.min(...lo))*k,0.035);
  const s=Math.min(W/spX,H/spLat)*0.8;
  const X=g=>+(W/2+(g-cLng)*k*s).toFixed(1),Y=a=>+(H/2-(a-cLat)*s).toFixed(1);
  proj={W,H,k,s,cLat,cLng};
  const pos=p=>{const x=X(p.lng),y=Y(p.lat),dx=x-W/2,dy=y-H/2,m=28;const t=Math.min(dx?(W/2-m)/Math.abs(dx):Infinity,dy?(H/2-m)/Math.abs(dy):Infinity);return t<1?{x:+(W/2+dx*t).toFixed(1),y:+(H/2+dy*t).toFixed(1),far:true}:{x,y,far:false}};
  const P=pts=>pts.map(([a,g])=>X(g)+","+Y(a)).join(" ");
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="강릉 지도에 표시한 장소">
    <rect width="${W}" height="${H}" fill="var(--land)"/>
    <polyline points="${P(RIVER)}" fill="none" stroke="var(--sea-fill)" stroke-width="${Math.max(3,s*0.0012)}" stroke-linecap="round"/>
    <ellipse cx="${X(128.8985)}" cy="${Y(37.7955)}" rx="${(0.0065*k*s).toFixed(1)}" ry="${(0.0045*s).toFixed(1)}" fill="var(--sea-fill)"/>
    <polygon points="${P([...COAST,[37.3,130.5],[38.3,130.5],[38.3,128.6]])}" fill="var(--sea-fill)"/>
    <polyline points="${P(COAST)}" fill="none" stroke="var(--sea)" stroke-opacity=".35" stroke-width="1.5"/>`;
  // 바다 라벨: 해안선 동쪽 화면 안쪽
  svg+=`<text class="sea-l" x="${W-30}" y="${H*0.5}" text-anchor="end">동해</text>`;
  for(const [n,a,g] of REFS){const x=X(g),y=Y(a);if(x>-20&&x<W+20&&y>-10&&y<H+10)svg+=`<circle cx="${x}" cy="${y}" r="2.5" fill="var(--muted)"/><text class="ref" x="${x+6}" y="${y-5}">${n}</text>`}
  // 동선
  const dl=mapDay==="all"?days.filter(d=>d):[+mapDay].filter(d=>d);
  for(const d of dl){const st=routeStops(d);if(st.length>1)svg+=`<polyline points="${st.map(p=>{const q=pos(p);return q.x+","+q.y}).join(" ")}" fill="none" stroke="${DAYC(d)}" stroke-width="2.5" stroke-dasharray="6 5" stroke-linejoin="round" opacity=".85"/>`}
  // 마커
  const order=p=>{const d=effDay(p);return d?dayStops(d).indexOf(p)+1:""};
  const label=shown.length<=14;
  for(const p of shown){
    const q=pos(p),x=q.x,y=q.y,d=effDay(p),sel=openId===p.id;
    if(q.far){const right=x>W/2,dist=Math.round(km({lat:cLat,lng:cLng},p));
      svg+=`<g class="mk" data-pid="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)} 열기 (지도 밖)">
      <circle cx="${x}" cy="${y}" r="11" fill="var(--land)" stroke="${d?DAYC(d):"var(--d0)"}" stroke-width="2.5" stroke-dasharray="3 2"/>
      <text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="700" fill="${d?DAYC(d):"var(--d0)"}">${isStay(p)?"숙":d?order(p):"?"}</text>
      <text class="pl" x="${right?x-16:x+16}" y="${y+4}" text-anchor="${right?"end":"start"}">${esc(p.name)} · 약 ${dist}km 밖</text></g>`;continue}
    if(isStay(p)){svg+=`<g class="mk" data-pid="${p.id}" tabindex="0" role="button" aria-label="숙소 ${esc(p.name)} 열기">
      <path d="M${x} ${y-15} L${x+14} ${y-2} L${x+10} ${y-2} L${x+10} ${y+11} L${x-10} ${y+11} L${x-10} ${y-2} L${x-14} ${y-2} Z" fill="var(--ink)" stroke="var(--land)" stroke-width="2" stroke-linejoin="round"/>
      <rect x="${x-3}" y="${y+3}" width="6" height="8" fill="var(--land)"/>
      <text class="pl" x="${x+17}" y="${y+4}">${esc(p.name)}</text></g>`;continue}
    svg+=`<g class="mk" data-pid="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)} 열기">
      <circle cx="${x}" cy="${y}" r="${sel?14:11}" fill="${d&&!p.cand?DAYC(d):"var(--surface)"}" stroke="${d?(p.cand?DAYC(d):"var(--on-dot)"):"var(--d0)"}" stroke-width="2" ${p.cand?'stroke-dasharray="3 2"':""}/>
      <text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="700" fill="${d?(p.cand?DAYC(d):"var(--on-dot)"):"var(--d0)"}">${d&&!p.cand?order(p):"?"}</text>
      ${label||sel?`<text class="pl" x="${x+16}" y="${y+4}">${esc(p.name)}${p.approx?" (대략)":""}</text>`:""}</g>`;
  }
  // 축척
  const pk=s/111;let sk=[0.5,1,2,5,10].find(v=>v*pk>=60)||10;const bw=sk*pk;
  svg+=`<g transform="translate(16 ${H-18})"><rect x="-6" y="-18" width="${bw+48}" height="26" rx="4" fill="var(--land)" opacity=".85"/><line x1="0" y1="0" x2="${bw}" y2="0" stroke="var(--ink)" stroke-width="2"/><line x1="0" y1="-4" x2="0" y2="0" stroke="var(--ink)" stroke-width="2"/><line x1="${bw}" y1="-4" x2="${bw}" y2="0" stroke="var(--ink)" stroke-width="2"/><text x="${bw+6}" y="4" font-size="12" fill="var(--ink)">${sk} km</text></g>`;
  if(!shown.length)svg+=`<text x="${W/2}" y="${H/2+60}" text-anchor="middle" font-size="14" fill="var(--muted)">${places.length?"이 날에는 위치가 확인된 장소가 없어요":"장소를 추가하면 여기에 표시돼요"}</text>`;
  $("#map").innerHTML=svg+"</svg>";
  $("#map").classList.toggle("picking",!!pickId);
  const pp=pickId&&places.find(p=>p.id===pickId);
  if(pp){$("#mapNote").innerHTML=`<strong>${esc(pp.name)}</strong> 위치를 지도에서 눌러 주세요.<button class="ghost" data-act="pickcancel">취소</button>`;return}
  const missing=places.filter(p=>!okCoord(p.lat,p.lng));
  const finding=missing.filter(p=>busy["loc"+p.id]);
  const canAuto=sample&&!readOnly&&missing.some(p=>!isStay(p))&&!finding.length;
  $("#mapNote").innerHTML=missing.length
    ?`지도에 없는 곳: ${esc(missing.map(p=>p.name).join(", "))}${finding.length?" (위치 찾는 중…)":""}.${canAuto?' <button class="ghost" data-act="locall">위치 자동으로 찾기</button>':" 장소를 열고 '위치 찾기'를 눌러 주세요."}`
    :"같은 날 장소는 시간순으로 이어져요. 강릉 밖 장소는 지도 가장자리에 방향과 거리로 표시돼요. 거리는 직선 거리예요.";
}
async function locate(id,name,explicit){
  if(!sample){if(explicit)toast("Claude 사용이 허용되지 않아 위치를 찾을 수 없어요.");return}
  const p=places.find(x=>x.id===id)||{};
  busy["loc"+id]=true;if(openId===id)render();else renderMap();
  const ctx=[p.cat&&`종류: ${p.cat}`,p.memo&&`메모: ${p.memo}`,p.info?.area&&`위치 설명: ${p.info.area}`].filter(Boolean).join("\n");
  try{
    const r=await sample.json(`강릉 여행 일정에 넣은 장소 "${name}"의 위도와 경도를 알려줘.
${ctx}
- 정확히 아는 곳이면 그 좌표를 주고 precision은 "exact".
- 정확한 위치는 모르지만 동네나 지역을 짐작할 수 있으면(이름, 메모, 주소, 종류로 판단) 그 동네 중심 좌표를 주고 precision은 "area".
- 전혀 짐작이 안 되면 강릉 시내 중심(강릉역 근처) 좌표를 주고 precision은 "guess".
- 휴게소처럼 강릉 밖 장소일 수도 있어. 같은 이름이 여러 곳이면 강릉 근처나 서울-강릉 가는 길을 골라.
오직 JSON 객체 하나로만 답해: {"lat":37.78,"lng":128.9,"precision":"exact"}`);
    if(r&&okCoord(+r.lat,+r.lng)){
      const approx=r.precision==="exact"?false:(r.precision==="area"?"area":"guess");
      await patch(id,{lat:+r.lat,lng:+r.lng,approx,pinned:false});
      if(explicit)toast(approx===false?`${name} 위치를 찍었어요`:approx==="area"?`${name}: 동네 기준 대략 위치로 찍었어요`:`${name}: 위치를 몰라서 강릉 시내에 임시로 찍었어요`);
    }else if(explicit)toast("위치를 찾지 못했어요. '직접 찍기'로 지도에서 눌러 주세요.");
  }catch(e){
    if(e?.code==="not_granted"){sample=null;toast("Claude 사용을 허용하면 위치를 자동으로 찾아요.")}
    else if(explicit)toast(e?.code==="rate_limited"?"요청이 많아요. 잠시 후 다시 눌러 주세요.":"위치를 찾지 못했어요. 다시 눌러 주세요.");
  }
  finally{busy["loc"+id]=false;if(openId===id)render();else renderMap()}
}
async function loadNames(){
  if(!user)return;
  const ids=[...new Set(places.map(p=>p.by).filter(Boolean))].filter(id=>!(id in names));
  if(!ids.length)return;
  try{const ps=await user.profiles(ids);ids.forEach(id=>names[id]=ps[id]?.name||"");if(openId)render();}catch{}
}

async function addPlace(name,cat,day,time,memo,cand){
  name=name.trim(); if(!name)return;
  if(!db){toast("공유 저장소에 연결되지 않아 추가할 수 없어요.");return}
  const doc={name,cat,day,time:time||"",memo:memo||"",createdAt:Date.now()};
  if(cand)doc.cand=true;
  if(myId)doc.by=myId;
  const c=known(name);if(c){doc.lat=c[0];doc.lng=c[1]}
  try{const ref=await db.collection("places").add(doc);toast(`${name} 추가했어요`);if(!c&&cat!=="숙소")locate(ref.id,name)}
  catch(e){handleWriteErr(e)}
}
function handleWriteErr(e){
  if(e?.code==="invalid_argument"){readOnly=true;render();toast("보기 권한만 있어서 수정할 수 없어요.")}
  else if(e?.code==="quota_exceeded")toast("저장 공간이 가득 찼어요. 안 쓰는 장소를 지워 주세요.");
  else toast("저장하지 못했어요. 잠시 후 다시 시도해 주세요.");
}
async function patch(id,data){try{await db.collection("places").doc(id).update(data)}catch(e){handleWriteErr(e)}}

async function getInfo(p){
  busy[p.id]=true;render();
  const prompt=`강원도 강릉 여행을 계획하고 있어. 장소: "${p.name}" (종류: ${p.cat}).
이 장소에 대해 여행자에게 도움이 되는 정보를 한국어로 간단히 정리해 줘. 잘 모르거나 불확실한 항목은 빈 문자열로 두고 지어내지 마.
오직 이 JSON 객체 하나로만 답해:
{"summary":"어떤 곳인지 1~2문장","area":"대략적인 위치/동네와 근처 명소","hours":"일반적인 운영 시간이나 추천 방문 시간대","cost":"입장료나 1인 예상 비용","stay":"보통 머무는 시간","tip":"알아두면 좋은 팁 1~2개","lat":37.78,"lng":128.9}
lat/lng는 대략적인 위도·경도 숫자이고, 모르면 null로 둬.`;
  try{
    const r=await sample.json(prompt,{modelTier:"default"});
    const info={};["summary","area","hours","cost","stay","tip"].forEach(k=>{if(r&&typeof r[k]==="string"&&r[k].trim())info[k]=r[k].trim().slice(0,400)});
    info.at=Date.now();
    const up={info};if(!p.pinned&&!isStay(p)&&r&&okCoord(+r.lat,+r.lng)){up.lat=+r.lat;up.lng=+r.lng;up.approx=false}
    await patch(p.id,up);
    if(!up.lat&&!okCoord(p.lat,p.lng)&&!isStay(p))locate(p.id,p.name,true);
  }catch(e){
    const m={not_granted:"Claude 사용을 허용해야 정보를 받을 수 있어요.",rate_limited:"요청이 많아요. 잠시 후 다시 눌러 주세요.",invalid_json:"정보를 정리하지 못했어요. 다시 눌러 주세요.",refused:"이 장소 정보는 받을 수 없었어요."};
    toast(m[e?.code]||"정보를 받지 못했어요. 다시 시도해 주세요.");
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code))sample=null;
  }finally{busy[p.id]=false;render()}
}

// events
$("#addForm").addEventListener("submit",e=>{e.preventDefault();
  addPlace($("#fName").value,$("#fCat").value,+$("#fDay").value,$("#fTime").value,$("#fMemo").value,$("#fCand").checked);
  $("#fName").value="";$("#fMemo").value="";$("#fTime").value="";$("#fCand").checked=false;$("#fName").focus();});
$("#ideas").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b)addPlace(b.dataset.n,b.dataset.c,0,"","")});
$("#board").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const id=b.closest(".card").dataset.id, p=places.find(x=>x.id===id);if(!p)return;
  const a=b.dataset.act;
  if(a==="toggle"){openId=openId===id?null:id;render();loadNames()}
  else if(a==="info")getInfo(p);
  else if(a==="find")locate(id,p.name,true);
  else if(a==="pick"){pickId=id;renderMap();document.querySelector(".mapbox").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"})}
  else if(a==="del"){busy["del"+id]=true;render()}
  else if(a==="del0"){busy["del"+id]=false;render()}
  else if(a==="del2"){busy["del"+id]=false;openId=null;db.collection("places").doc(id).delete().then(()=>toast(`${p.name} 삭제했어요`)).catch(handleWriteErr)}
});
$("#board").addEventListener("change",e=>{
  const f=e.target.dataset.f;if(!f)return;
  const id=e.target.closest(".card").dataset.id;
  const v=f==="day"?+e.target.value:f==="cand"?e.target.checked:e.target.value;
  patch(id,{[f]:v});
});
$("#mapHead").addEventListener("click",e=>{const b=e.target.closest("[data-md]");if(b){mapDay=b.dataset.md;renderMap()}});
function openFromMap(id){openId=id;render();loadNames();const c=document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);c?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"center"})}
$("#map").addEventListener("click",e=>{
  if(pickId){const svg=$("#map svg");if(!svg||!proj)return;
    const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
    const lat=+(proj.cLat-(q.y-proj.H/2)/proj.s).toFixed(5),lng=+(proj.cLng+(q.x-proj.W/2)/(proj.k*proj.s)).toFixed(5);
    const id=pickId,nm=places.find(p=>p.id===id)?.name||"";pickId=null;
    if(okCoord(lat,lng))patch(id,{lat,lng,pinned:true,approx:false}).then(()=>toast(`${nm} 위치를 찍었어요`));else{toast("강릉 근처를 눌러 주세요");renderMap()}
    return}
  const g=e.target.closest(".mk");if(g)openFromMap(g.dataset.pid)});
$("#mapNote").addEventListener("click",e=>{
  if(e.target.closest('[data-act="pickcancel"]')){pickId=null;renderMap()}
  if(e.target.closest('[data-act="locall"]')){places.filter(p=>!okCoord(p.lat,p.lng)&&!isStay(p)).slice(0,5).forEach(p=>locate(p.id,p.name))}});
$("#map").addEventListener("keydown",e=>{const g=e.target.closest(".mk");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openFromMap(g.dataset.pid)}});
let tripTimer;
trip.days=2; // 항상 1·2일차 2단 고정
function saveTrip(){clearTimeout(tripTimer);tripTimer=setTimeout(async()=>{
  if(!db)return;try{await db.doc("meta/trip").set({days:2,start:$("#start").value||""})}catch(e){handleWriteErr(e)}},500)}
$("#start").addEventListener("change",()=>{trip.start=$("#start").value;render();saveTrip()});

renderForm();render();

// ---- 서버 연결 (Supabase REST) ----
// 라이브러리 없이 fetch 로 Supabase REST API 를 직접 호출합니다. (GitHub Pages 같은 정적 호스팅에 그대로 올라감)
// 화면 코드가 쓰는 db / sample 인터페이스를 Firebase 모양으로 흉내 내서, 위쪽 코드는 그대로 둡니다.
const CFG=window.APP_CONFIG||{};
const SB_URL=(CFG.supabaseUrl||"").replace(/\/+$/,"");
const SB_KEY=CFG.supabaseAnonKey||"";
const REST=SB_URL+"/rest/v1";
const POLL_MS=CFG.pollMs||4000;
// 편집 암호: config.js 의 editKey 가 있으면, 사용자가 같은 값을 한 번 입력해야 편집 가능 (브라우저에 기억)
const APP_EDIT_KEY=(CFG.editKey||"").trim();
const KEY_STORE="gangneung-edit-key";
function getKey(){try{return localStorage.getItem(KEY_STORE)||""}catch{return ""}}
function setKey(v){try{v?localStorage.setItem(KEY_STORE,v):localStorage.removeItem(KEY_STORE)}catch{}}
let needKey=!!APP_EDIT_KEY;
// 쓰기 전에 편집 암호 확인 (클라이언트 측 간단 잠금). 읽기는 누구나.
function ensureEditAllowed(){
  if(!APP_EDIT_KEY)return true;
  if(getKey()===APP_EDIT_KEY)return true;
  const v=window.prompt("편집하려면 편집 암호를 입력해 주세요.");
  if(v&&v.trim()===APP_EDIT_KEY){setKey(v.trim());return true}
  if(v!==null)toast("편집 암호가 맞지 않아요.");
  throw {code:"invalid_argument",message:"편집 암호가 필요해요."};
}
// Supabase REST 호출
async function sb(method,pathAndQuery,body,extraHeaders){
  if(!SB_URL||!SB_KEY)throw {code:"unavailable",message:"Supabase 설정이 없어요."};
  const headers={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"content-type":"application/json",...(extraHeaders||{})};
  let r;
  try{r=await fetch(REST+pathAndQuery,{method,headers,body:body?JSON.stringify(body):undefined})}
  catch{throw {code:"unavailable",message:"서버에 연결할 수 없어요."}}
  if(r.status===401||r.status===403)throw {code:"invalid_argument",message:"권한이 없어요. (키/정책 확인)"};
  if(!r.ok){let m="오류 "+r.status;try{m=(await r.json()).message||m}catch{}throw {code:"upstream_error",message:m}}
  if(r.status===204)return null;
  try{return await r.json()}catch{return null}
}

// 상태 폴링: places 테이블과 trip(1행)을 주기적으로 읽어 구독자에게 전달
const subs={places:[],trip:[]};let pollTimer=null;
async function refresh(){
  try{
    const [placesRows,tripRows]=await Promise.all([
      sb("GET","/places?select=*&order=created_at.asc"),
      sb("GET","/trip?id=eq.1&select=*"),
    ]);
    sample=null; // Supabase 버전은 AI(Claude) 기능 없음
    const t=(tripRows&&tripRows[0])||{};
    const tripSnap={exists:true,data:()=>({days:t.days??2,start:t.start||""})};
    // DB 행(snake/ JSON) → 화면이 쓰는 모양으로
    const placeSnap={docs:(placesRows||[]).map(row=>({
      id:row.id,
      data:()=>({
        name:row.name,cat:row.cat,day:row.day,time:row.time||"",memo:row.memo||"",
        lat:row.lat??undefined,lng:row.lng??undefined,
        pinned:row.pinned||undefined,cand:row.cand||undefined,approx:row.approx??undefined,
        by:row.by||undefined,createdAt:row.created_at?Date.parse(row.created_at):undefined,
        info:row.info||undefined,
      }),
    }))};
    subs.trip.forEach(f=>f(tripSnap));subs.places.forEach(f=>f(placeSnap));
    if(!readOnly)$("#status").textContent=`함께 보는 중 · ${(placesRows||[]).length}곳`;
  }catch(e){$("#status").textContent="서버에 연결할 수 없어요. 잠시 후 다시 시도해요.";}
}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(()=>{if(!document.hidden)refresh()},POLL_MS)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
const after=(p)=>p.then(v=>{refresh();return v});

// 화면 코드가 쓰는 필드 → DB 컬럼으로 변환 (createdAt→created_at 등)
function toRow(doc){
  const r={};
  if("name" in doc)r.name=doc.name;
  if("cat" in doc)r.cat=doc.cat;
  if("day" in doc)r.day=doc.day;
  if("time" in doc)r.time=doc.time;
  if("memo" in doc)r.memo=doc.memo;
  if("lat" in doc)r.lat=doc.lat;
  if("lng" in doc)r.lng=doc.lng;
  if("pinned" in doc)r.pinned=doc.pinned;
  if("cand" in doc)r.cand=doc.cand;
  if("approx" in doc)r.approx=doc.approx;
  if("by" in doc)r.by=doc.by;
  if("info" in doc)r.info=doc.info;
  if("createdAt" in doc)r.created_at=new Date(doc.createdAt).toISOString();
  return r;
}
function makeDb(){
  return {
    collection(name){
      if(name!=="places")throw new Error("unknown collection "+name);
      return {
        add:(doc)=>{ensureEditAllowed();return after(
          sb("POST","/places",toRow(doc),{Prefer:"return=representation"})
        ).then(rows=>({id:rows&&rows[0]&&rows[0].id}))},
        doc:(id)=>({
          update:(data)=>{ensureEditAllowed();return after(
            sb("PATCH","/places?id=eq."+encodeURIComponent(id),toRow(data)))},
          delete:()=>{ensureEditAllowed();return after(
            sb("DELETE","/places?id=eq."+encodeURIComponent(id)))},
        }),
        onSnapshot:(next)=>{subs.places.push(next);return()=>{}},
      };
    },
    doc(path){
      if(path!=="meta/trip")throw new Error("unknown doc "+path);
      return {
        set:(data)=>{ensureEditAllowed();return after(
          sb("POST","/trip?on_conflict=id",{id:1,days:data.days,start:data.start||null},
             {Prefer:"resolution=merge-duplicates"}))},
        onSnapshot:(next)=>{subs.trip.push(next);return()=>{}},
      };
    },
  };
}

(async()=>{
  if(!SB_URL||!SB_KEY||SB_URL.includes("xxxxxxxx")){
    $("#status").textContent="config.js 에 Supabase URL/키를 넣어 주세요.";$("#addBtn").disabled=true;return;
  }
  db=makeDb();sample=null;user=null;
  db.doc("meta/trip").onSnapshot(s=>{
    if(s.exists){const d=s.data();trip.days=2;trip.start=d.start||"";
      if(document.activeElement!==$("#start"))$("#start").value=trip.start;}
    renderForm();render();
  });
  db.collection("places").onSnapshot(s=>{
    places=s.docs.map(d=>({id:d.id,...d.data()}));
    if(!readOnly)$("#status").textContent=`함께 보는 중 · ${places.length}곳`;
    const a=document.activeElement;if(a&&a.dataset&&(a.dataset.f==="memo"||a.dataset.f==="time"))return;
    render();
  });
  await refresh();startPolling();
})();
</script>
