# Anhae-love.github.io — GitHub Pages 발행
# web/(쇼케이스)를 사이트 루트로, underground/(지하실)를 /underground/ 로 묶어서 올린다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 발행 폴더 구성 (_site)
        run: |
          mkdir -p _site
          # 쇼케이스를 루트로
          cp -r web/* _site/ 2>/dev/null || true
          # 지하실을 하위 경로로
          mkdir -p _site/underground
          cp -r underground/* _site/underground/ 2>/dev/null || true
          # 강릉 여행 계획을 하위 경로로
          mkdir -p _site/gangneung
          cp -r gangneung/* _site/gangneung/ 2>/dev/null || true
          # Jekyll 처리를 끈다 (정적 그대로)
          touch _site/.nojekyll
          # 폴더/파일명이 '_'로 시작해도 무시되지 않게
          echo "site built:" && ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
